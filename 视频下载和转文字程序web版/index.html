<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>视频转文字（多平台）</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f2f4f8; color: #1f2329; -webkit-text-size-adjust: 100%;
  }
  .app { max-width: 560px; margin: 0 auto; padding: 22px 14px 40px; }
  h1 { font-size: 20px; margin: 4px 0 14px; text-align: center; }
  .card {
    background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .card-title { font-weight: 600; font-size: 14px; margin-bottom: 10px; }
  textarea {
    width: 100%; border: 1px solid #dfe3e8; border-radius: 8px;
    padding: 10px; font-size: 14px; background: #fafbfc; color: #1f2329;
    font-family: inherit; resize: vertical; min-height: 56px; line-height: 1.5;
  }
  #transcript { min-height: 180px; background: #fff; }
  button {
    border: none; border-radius: 8px; padding: 11px 14px; font-size: 14px;
    font-weight: 600; cursor: pointer; margin-top: 10px;
  }
  .btn { background: #07c160; color: #fff; width: 100%; }
  .btn:disabled { background: #a7e3c2; cursor: not-allowed; }
  .btn-ghost { background: #eef1f5; color: #2b6cff; width: auto; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .logs {
    background: #0e1116; color: #d6e2ff; border-radius: 8px; padding: 10px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
    line-height: 1.6; max-height: 220px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
  }
  a.btn-ghost { display: inline-block; text-decoration: none; text-align: center; }
  .hint { font-size: 12px; color: #8a9099; margin-top: 8px; line-height: 1.5; }
  .foot { text-align: center; font-size: 12px; color: #8a9099; margin-top: 8px; }
  .video-meta { font-size: 13px; color: #5a6068; margin-bottom: 8px; word-break: break-all; }
</style>
</head>
<body>
<div class="app">
  <h1>视频 → 文字</h1>

  <div class="card">
    <div class="card-title">视频分享链接</div>
    <textarea id="link" placeholder="粘贴任意平台分享链接（抖音/快手/小红书/B站/油管/TikTok…）"></textarea>
    <button id="start" class="btn">开始处理</button>
    <div class="hint">腾讯云密钥已配置在云函数环境变量中，这里无需填写。</div>
  </div>

  <div class="card">
    <div class="card-title">进度</div>
    <div id="logs" class="logs">（等待开始）</div>
  </div>

  <div class="card" id="videoCard" style="display:none">
    <div class="card-title">保存视频</div>
    <div class="video-meta" id="videoTitle"></div>
    <video id="videoPreview" controls playsinline preload="none" style="width:100%;border-radius:8px;background:#000;margin-bottom:10px;"></video>
    <button id="videoDownload" class="btn">下载视频（保存到本机 / 相册）</button>
    <a id="videoLink" class="btn-ghost" target="_blank" rel="noopener">打开原始链接</a>
    <div class="hint">电脑：点“下载视频”直接存到本机。手机：点“下载视频”后到“文件/下载”里找；或长按上方视频预览选「存储到相册」。</div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div class="card-title">识别文字</div>
    <textarea id="transcript" readonly placeholder="识别完成后的文字会显示在这里"></textarea>
    <div class="row">
      <button id="copyBtn" class="btn">复制全部文字</button>
      <button id="downTxt" class="btn-ghost">下载 .txt</button>
    </div>
  </div>

  <div class="foot">已支持多平台解析，可直接使用</div>
</div>

<script>
// ===== 函数 URL 已配置 =====
const CONFIG = {
  API_BASE: 'https://1454191009-hsur78lw3b.ap-guangzhou.tencentscf.com'
};
// ============================

const $ = (id) => document.getElementById(id);

function log(msg) {
  const el = $('logs');
  el.textContent += (el.textContent === '（等待开始）' ? '' : '\n') + msg;
  el.scrollTop = el.scrollHeight;
}

async function postJSON(url, payload) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); }
  catch (e) { throw new Error('返回非 JSON：' + text.slice(0, 300)); }
  // 兼容云函数/API 网关可能多套的一层信封 {statusCode, headers, body}
  if (data && typeof data.body === 'string' && data.statusCode !== undefined) {
    try { data = JSON.parse(data.body); } catch (_) { /* 保留原样 */ }
  }
  return data;
}

function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

function showVideo(p) {
  $('videoTitle').textContent = p.title;
  $('videoPreview').src = p.videoUrl || '';
  $('videoLink').href = p.videoUrl || '#';
  $('videoDownload').onclick = () => downloadVideo(p.videoUrl, p.title);
  $('videoCard').style.display = 'block';
}

async function start() {
  const link = $('link').value.trim();
  if (!link) { alert('请粘贴视频分享链接'); return; }

  // 本次会话的稳定 token：后端用它在 /tmp 保留中间文件（下载/提取结果可跨步骤复用）
  const token = Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);

  $('start').disabled = true;
  $('logs').textContent = '';
  $('videoCard').style.display = 'none';
  $('resultCard').style.display = 'none';

  try {
    // ① 解析
    log('① 解析分享链接…');
    const p = await postJSON(CONFIG.API_BASE, { action: 'parse', link, token });
    if (!p || !p.ok) { log('✖ ' + ((p && p.msg) || '解析失败')); return; }
    if (p.warn) {
      log('✔ 解析成功：' + p.title);
      showVideo(p);
      log('⚠ ' + p.warn);
      return;
    }
    const resTxt = (p.meta && p.meta.res && p.meta.res !== 9999) ? ('（选 ' + p.meta.res + 'p ' + (p.meta.fmt || '') + '）') : '';
    log('✔ 解析成功：' + p.title + resTxt);
    showVideo(p);

    // ② 下载
    const decl = (p.meta && p.meta.res && p.meta.res !== 9999) ? ('（' + p.meta.res + 'p）') : '';
    log('② 下载视频' + decl + '…' + (p.declared ? ' 约 ' + (p.declared / 1048576).toFixed(0) + 'MB' : ''));
    const d = await postJSON(CONFIG.API_BASE, { action: 'download', token, videoUrl: p.videoUrl, title: p.title });
    if (!d || !d.ok) {
      if (d && d.warn) { showVideo(d); log('⚠ ' + d.warn); return; }
      log('✖ ' + ((d && d.msg) || '下载失败')); return;
    }
    if (d.warn) { showVideo(d); log('⚠ ' + d.warn); return; }
    log('✔ 下载完成：' + (d.size / 1048576).toFixed(1) + 'MB' + (d.reused ? '（复用已下载）' : ''));

    // ③ 提取音频
    log('③ 提取 AAC 音频…');
    const e = await postJSON(CONFIG.API_BASE, { action: 'extract', token, videoUrl: p.videoUrl, title: p.title });
    if (!e || !e.ok) { log('✖ ' + ((e && e.msg) || '提取失败')); return; }
    log('✔ 提取完成：' + e.frames + ' 帧 / ' + e.sampleRate + ' Hz，' + e.audioBytes + ' 字节' + (e.reused ? '（复用已提取）' : ''));

    // ④ 提交 ASR
    log('④ 提交腾讯云 ASR 识别…');
    const s = await postJSON(CONFIG.API_BASE, { action: 'submit', token, videoUrl: p.videoUrl, title: p.title });
    if (!s || !s.ok) { log('✖ ' + ((s && s.msg) || '提交失败')); return; }
    const taskIds = Array.isArray(s.taskIds) ? s.taskIds : [];
    if (!taskIds.length) { log('✖ 未获得识别任务'); return; }
    log('✔ 已提交：' + (s.segCount > 1 ? s.segCount + ' 段（音频>5MB 已自动分段）' : '1 段') + '，共 ' + taskIds.length + ' 个任务');

    // ⑤ 轮询识别结果
    log('⑤ 轮询识别结果（每 3 秒）…');
    for (let i = 1; i <= 80; i++) {
      await sleep(3000);
      const q = await postJSON(CONFIG.API_BASE, { action: 'queryAll', taskIds });
      if (q.done) {
        if (q.ok) {
          $('transcript').value = q.transcript || '(识别结果为空)';
          $('resultCard').style.display = 'block';
          log('✔ 识别完成！共 ' + (q.transcript ? q.transcript.length : 0) + ' 字，见下方结果框');
        } else {
          log('✖ ' + (q.msg || ('返回结构异常：' + JSON.stringify(q).slice(0, 200))));
        }
        return;
      }
      log('  识别中…（第 ' + i + ' 次，进度=' + (q.progress || '?') + '）');
    }
    log('✖ 识别超时（约 4 分钟未完成）');
  } catch (err) {
    log('✖ 出错：' + (err.message || err));
  } finally {
    $('start').disabled = false;
  }
}

async function downloadVideo(url, title) {
  if (!url) { alert('缺少视频地址'); return; }
  log('⏬ 通过云函数代理下载视频…');
  try {
    const res = await fetch(CONFIG.API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'video', videoUrl: url, title })
    });
    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      try { const j = JSON.parse(await res.text()); if (j.msg) msg = j.msg; } catch (e) {}
      throw new Error(msg);
    }
    // 超出网关大小限制等情况会返回 JSON（HTTP 200，{ok:false}），需识别出来
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('application/json')) {
      const j = JSON.parse(await res.text());
      throw new Error(j.msg || '返回的不是视频（JSON）');
    }
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (title || 'douyin').replace(/[\\/:"*?<>|]/g, '_').slice(0, 80) + '.mp4';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
    log('✔ 已开始下载视频文件');
  } catch (e) {
    log('✖ 代理下载失败：' + (e.message || e));
    log('   改用：长按上方视频预览选「存储到相册」，或用“打开原始链接”');
  }
}

function copyText() {
  const t = $('transcript').value;
  if (!t) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(() => alert('已复制')).catch(() => fallbackCopy(t));
  } else { fallbackCopy(t); }
}
function fallbackCopy(t) {
  const ta = document.createElement('textarea');
  ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); alert('已复制'); } catch (e) { alert('复制失败，请手动选择'); }
  document.body.removeChild(ta);
}
function downTxt() {
  const t = $('transcript').value;
  if (!t) return;
  const blob = new Blob([t], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = ($('videoTitle').textContent || 'transcript') + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

$('start').addEventListener('click', start);
$('copyBtn').addEventListener('click', copyText);
$('downTxt').addEventListener('click', downTxt);
</script>
</body>
</html>
